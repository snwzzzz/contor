openapi: 3.0.3
info:
  title: contor API
  description: |
    Single source of truth for the contor HTTP API.
    Backend interfaces/models and the frontend client are generated from this file.
    Never edit generated code; change this spec and regenerate.

    Naming conventions: `NewXCommand` (create), `UpdateXCommand` (partial update, `null` = unchanged),
    `XDto` (read model). IDs are plain integers.

    Authentication: session cookie (set by `POST /api/auth/login`). Every mutating request needs the
    `X-XSRF-TOKEN` header carrying the value of the `XSRF-TOKEN` cookie (see `GET /api/auth/csrf`).
    Every error response has the `ErrorResponse` body.
  version: 0.1.0
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: System
    description: Application meta information
  - name: Auth
    description: Session login/logout, CSRF bootstrap, current user, password change
  - name: Setup
    description: One-time first-run setup (creates the OWNER). Only reachable while no user exists.
  - name: Collections
    description: User/AI-defined collections and their fields. Schema changes are OWNER-only.
  - name: Records
    description: Records of a collection. Values are keyed by field slug.
  - name: Labels
    description: Labels for emails
  - name: Rules
    description: Deterministic mail rules (stored only in phase 1)
  - name: Relations
    description: Relation types and relations between records (graph)
  - name: Proposals
    description: AI proposals and their decisions
  - name: SavedQueries
    description: Saved queries (stored only in phase 1)
  - name: Mail
    description: Synced mailboxes and emails (read-only in phase 1)
  - name: Dev
    description: Local development only (backend `dev` profile); these paths do not exist otherwise
  - name: Senders
    description: Pictures of mail senders (sender domain logos, Outlook contact photos)
  - name: AI
    description: Local Ollama assistant - model status, permissions (setup wizard) and inbox analysis runs
paths:
  /api/system/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Application name and version
      responses:
        '200':
          description: The running application version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: initCsrf
      summary: Initialize the CSRF cookie
      description: |
        Sets the readable `XSRF-TOKEN` cookie. Every mutating request must echo its value in the
        `X-XSRF-TOKEN` header. The token rotates after login and logout; always read the current cookie.
      security: []
      responses:
        '204':
          description: CSRF cookie set
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with username and password (starts a session)
      description: |
        Unknown user, wrong password and locked account all return the same 401 message.
        5 failed attempts lock the account (15 min, doubling on repeated lockouts). Requests are rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: Logged in; session cookie set, session id rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/dev-login:
    get:
      tags: [Dev]
      operationId: getDevLogin
      summary: Whether automatic dev sign-in is available, and as whom
      description: |
        Only with the backend `dev` profile and a configured dev account (DEV_ACCOUNT_*), and only for requests from
        this machine (loopback). 404 otherwise.
      security: []
      responses:
        '200':
          description: Dev sign-in is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Dev]
      operationId: devLogin
      summary: Sign in as the dev account without a password (dev profile, loopback only)
      description: Starts a session exactly like the normal login (session id rotated, session limit, CSRF refresh, audit).
      security: []
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the logged-in user
      description: All other sessions of the user are ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordCommand'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/setup:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Whether first-run setup is still required
      description: Anonymous access only while no user exists; afterwards this requires authentication.
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Create the OWNER account with the one-time setup token from the backend log
      description: |
        Anonymous access only while no user exists. Once the owner exists the endpoint is permanently
        disabled (401 for anonymous, 404 for authenticated callers). Does not log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCommand'
      responses:
        '201':
          description: Owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: All active collections with their fields
      responses:
        '200':
          description: Collections ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection (and its table) with optional initial fields. OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCollectionCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/collections/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      tags: [Collections]
      operationId: getCollection
      summary: One collection with its fields (archived fields included, marked by archivedAt)
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Collections]
      operationId: updateCollection
      summary: Partial update of collection metadata (null = unchanged). OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/collections/{collectionId}/fields:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    post:
      tags: [Collections]
      operationId: addField
      summary: Add a field (adds the column(s) to the collection table). OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCollectionFieldCommand'
      responses:
        '201':
          description: The collection including the new field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/collections/{collectionId}/fields/{fieldId}/archive:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - name: fieldId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Collections]
      operationId: archiveField
      summary: Archive a field (hidden and read-only; the column is kept). OWNER only.
      responses:
        '200':
          description: The collection with the archived field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/collections/{collectionId}/records:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      tags: [Records]
      operationId: listRecords
      summary: Records of a collection, filtered, sorted and paginated
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            Repeatable `field:op:value` (AND-combined). `field` is a field slug or a system field
            (`id`, `title`, `status`, `createdAt`, `lastModified`). Ops: `eq`, `ne`, `lt`, `lte`, `gt`, `gte`,
            `contains` (text, case-insensitive), `empty`, `notempty` (no value). MONEY filters on the amount.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: Global search, case-insensitive, in the title and every text-like field (text, long text, email, URL, phone, enum, status); AND-combined with `filter`.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          description: Field slug or system field; prefix with `-` for descending. Default `-id`.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: One page of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Records]
      operationId: createRecord
      summary: Create a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecordCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/collections/{collectionId}/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - name: recordId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Records]
      operationId: getRecord
      summary: One record
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Records]
      operationId: updateRecord
      summary: Partial update. Keys absent from `values` are unchanged; a key with `null` clears the field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Delete a record
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/collections/{collectionId}/records/{recordId}/emails:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - name: recordId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Records]
      operationId: listRecordEmails
      summary: Emails of the current user's mailboxes in which the record comes up, newest first
      description: |
        An email belongs to a record when the record was created or updated from it (record source), when it was sent
        from one of the record's EMAIL field addresses, or when its sender address is at the record's domain (a field
        named `domain`, or the host of a URL field).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of emails (summaries without bodies)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPageDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/labels:
    get:
      tags: [Labels]
      operationId: listLabels
      summary: All labels ordered by name
      responses:
        '200':
          description: Labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabelDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Labels]
      operationId: createLabel
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabelCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/labels/{labelId}:
    parameters:
      - $ref: '#/components/parameters/LabelId'
    get:
      tags: [Labels]
      operationId: getLabel
      summary: One label
      responses:
        '200':
          description: The label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Labels]
      operationId: updateLabel
      summary: Partial update (null = unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabelCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Labels]
      operationId: deleteLabel
      summary: Delete a label (also removes it from all emails)
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: All rules ordered by priority (ascending), then name
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rules]
      operationId: createRule
      summary: Create a rule (stored only; rule execution comes in a later phase)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRuleCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [Rules]
      operationId: getRule
      summary: One rule
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rules]
      operationId: updateRule
      summary: Partial update (null = unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rules]
      operationId: deleteRule
      summary: Delete a rule
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/relation-types:
    get:
      tags: [Relations]
      operationId: listRelationTypes
      summary: All relation types ordered by name
      responses:
        '200':
          description: Relation types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationTypeDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Relations]
      operationId: createRelationType
      summary: Create a relation type. OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRelationTypeCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationTypeDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/relation-types/{relationTypeId}:
    parameters:
      - $ref: '#/components/parameters/RelationTypeId'
    get:
      tags: [Relations]
      operationId: getRelationType
      summary: One relation type
      responses:
        '200':
          description: The relation type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationTypeDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Relations]
      operationId: updateRelationType
      summary: Partial update of names and attribute schema (null = unchanged). OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRelationTypeCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationTypeDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Relations]
      operationId: deleteRelationType
      summary: Delete a relation type that is not used by any relation. OWNER only.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/relations:
    get:
      tags: [Relations]
      operationId: listRelations
      summary: All relations of one record (outgoing and incoming)
      parameters:
        - name: collectionId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: recordId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Relations touching the record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
