          type: string
          format: date-time
        read:
          type: boolean
        hasAttachments:
          type: boolean
        processingState:
          $ref: '#/components/schemas/EmailProcessingState'
        processingError:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/EmailLabelDto'
    EmailPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmailSummaryDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    AiModelRole:
      type: string
      description: What a configured model is used for.
      enum: [EXTRACTION, ROUTING, EMBEDDING]
    AiPullState:
      type: string
      enum: [IDLE, PULLING, FAILED]
    AiModelDto:
      type: object
      required: [name, roles, installed, pullState]
      properties:
        name:
          type: string
          description: Ollama model tag, e.g. qwen3.5:9b
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AiModelRole'
        installed:
          type: boolean
        pullState:
          $ref: '#/components/schemas/AiPullState'
        pullPercent:
          type: integer
          format: int32
          description: Download progress 0-100 while PULLING
        pullError:
          type: string
    AiStatusDto:
      type: object
      required: [reachable, ready, models]
      properties:
        reachable:
          type: boolean
          description: Ollama answered on its (loopback) base URL
        version:
          type: string
        ready:
          type: boolean
          description: Reachable and every configured model installed
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModelDto'
        embeddings:
          $ref: '#/components/schemas/EmbeddingProgressDto'
    EmbeddingProgressDto:
      type: object
      description: |
        How much of the current user's inbox is indexed for semantic search with the configured embedding model.
        Absent when the status is not requested for a signed-in user.
      required: [indexed, total, running]
      properties:
        indexed:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        running:
          type: boolean
          description: A backfill is currently embedding mail
    AiAccess:
      type: string
      description: |
        OFF = the AI never touches this area · SUGGEST = proposals for review · AUTO = applied directly.
        `replies` (reply drafts) only knows OFF and SUGGEST: a draft is never sent, so AUTO is rejected (400).
      enum: ['OFF', SUGGEST, AUTO]
    AiSettingsDto:
      type: object
      required: [mailAccess, historyDays, categories, records, calendar, tasks, replies, externalApis, courtesyReplies, readHiddenMailboxes]
      properties:
        mailAccess:
          type: boolean
          description: The AI may read and analyze the user's mailboxes (master switch)
        historyDays:
          type: integer
          format: int32
          description: How many days back the inbox analysis reads; 0 = everything
        categories:
          $ref: '#/components/schemas/AiAccess'
        records:
          $ref: '#/components/schemas/AiAccess'
        calendar:
          $ref: '#/components/schemas/AiAccess'
        tasks:
          $ref: '#/components/schemas/AiAccess'
        replies:
          $ref: '#/components/schemas/AiAccess'
        externalApis:
          $ref: '#/components/schemas/AiAccess'
        courtesyReplies:
          type: boolean
          description: Also suggest optional polite replies to emails that need no answer (a job rejection, a thank-you); only with replies = SUGGEST
        ownerProfile:
          type: string
          nullable: true
          description: Who the user is in their own words (role, company, what it buys and sells); tells the AI whose side an email is on
        readHiddenMailboxes:
          type: boolean
          default: true
          description: The AI also reads mailboxes whose mail is hidden in the app (MailAccountDto.hidden), as long as their aiEnabled is on
        onboardedAt:
          type: string
          format: date-time
          description: When the setup wizard was completed; new mail is only processed afterwards
    UpdateAiSettingsCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        mailAccess:
          type: boolean
        historyDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 3650
        categories:
          $ref: '#/components/schemas/AiAccess'
        records:
          $ref: '#/components/schemas/AiAccess'
        calendar:
          $ref: '#/components/schemas/AiAccess'
        tasks:
          $ref: '#/components/schemas/AiAccess'
        replies:
          $ref: '#/components/schemas/AiAccess'
        externalApis:
          $ref: '#/components/schemas/AiAccess'
        courtesyReplies:
          type: boolean
        readHiddenMailboxes:
          type: boolean
        ownerProfile:
          type: string
          nullable: true
          maxLength: 2000
          description: null = unchanged; blank clears it
        completeOnboarding:
          type: boolean
          description: true marks the setup wizard as completed (sets onboardedAt once)
    AnalysisState:
      type: string
      description: |
        QUEUED → DISCOVERING → (AWAITING_REVIEW when discovered categories need approval) → EXTRACTING → COMPLETED;
        FAILED or CANCELLED end a run early.
      enum: [QUEUED, DISCOVERING, AWAITING_REVIEW, EXTRACTING, COMPLETED, FAILED, CANCELLED]
    EvalCaseExportDto:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/EvalCaseDto'
    EvalCaseDto:
      type: object
      description: One labelled email of the extraction evaluation (the file format of `ai-eval/**/*.json`).
      required: [id, email, expected, mustNotProduce]
      properties:
        id:
          type: string
        email:
          $ref: '#/components/schemas/EvalEmailDto'
        expected:
          $ref: '#/components/schemas/EvalExpectedDto'
        mustNotProduce:
          type: array
          items:
            $ref: '#/components/schemas/EvalForbiddenDto'
    EvalEmailDto:
      type: object
      required: [mailbox, fromAddress, to, subject, receivedAt, body]
      properties:
        mailbox:
          type: string
        fromName:
          type: string
          nullable: true
        fromAddress:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        receivedAt:
          type: string
          format: date-time
        body:
          type: string
    EvalExpectedDto:
      type: object
      required: [records]
      properties:
        records:
          type: object
          description: Expected records per collection slug.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/EvalRecordDto'
    EvalRecordDto:
      type: object
      required: [title, values]
      properties:
        title:
          type: string
        values:
          type: object
          additionalProperties: true
    EvalForbiddenDto:
      type: object
      required: [collection]
      properties:
        collection:
          type: string
        title:
          type: string
          nullable: true
    InsightRunDto:
      type: object
      required: [running]
      properties:
        running:
          type: boolean
          description: A pass requested by the user is queued or running
    AnalysisRunDto:
      type: object
      required: [id, status, discoverySteps, discoveryStepsDone, totalEmails, processedEmails, failedEmails, proposalsCreated, autoApplied, categoriesDiscovered, createdAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AnalysisState'
        since:
          type: string
          format: date-time
          description: Oldest email included; absent = everything
        discoverySteps:
          type: integer
          format: int32
          description: Model calls the category discovery needs (one per batch of emails plus one merge); 0 before it starts
        discoveryStepsDone:
          type: integer
          format: int32
        currentEmailSubject:
          type: string
          description: Subject of the email the model is reading right now (EXTRACTING only)
        currentEmailFrom:
          type: string
          description: Sender name (or address) of that email
        totalEmails:
          type: integer
          format: int32
        processedEmails:
          type: integer
          format: int32
        failedEmails:
          type: integer
          format: int32
        proposalsCreated:
          type: integer
          format: int32
          description: Proposals waiting for review
        autoApplied:
          type: integer
          format: int32
          description: Changes applied directly (AUTO permissions)
        categoriesDiscovered:
          type: integer
          format: int32
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ChatMessageRole:
      type: string
      description: USER = your question · ASSISTANT = the answer
      enum: [USER, ASSISTANT]
    ChatMessageStatus:
      type: string
      description: |
        PENDING (queued) - RETRIEVING (looking up records and emails) - WRITING (the model writes the answer) - DONE -
        FAILED (`error` says why; retry with `POST .../messages/{messageId}/retry`). Questions are always DONE.
      enum: [PENDING, RETRIEVING, WRITING, DONE, FAILED]
    ChatMentionType:
      type: string
      description: RECORD = a record of any collection (people and organizations included) · EMAIL = an email
      enum: [RECORD, EMAIL]
    ChatMentionDto:
      type: object
      description: A record or email an answer is about, shown as a link (`/collections/{collectionId}/records/{recordId}`, `/inbox?email={emailId}`)
      required: [type, label]
      properties:
        type:
          $ref: '#/components/schemas/ChatMentionType'
        collectionId:
          type: integer
          format: int64
          description: RECORD only
        recordId:
          type: integer
          format: int64
          description: RECORD only
        emailId:
          type: integer
          format: int64
          description: EMAIL only
        label:
          type: string
          description: The record's title or the email's subject
        collectionName:
          type: string
          description: RECORD only
    ChatMessageDto:
      type: object
      required: [id, role, status, blocks, sources, mentions, createdAt]
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        status:
          $ref: '#/components/schemas/ChatMessageStatus'
        text:
          type: string
          description: The question, or the answer as plain text (empty while the answer is written)
        blocks:
          type: array
          description: ASSISTANT - the answer's paragraphs, lists, quotes and tables; block and item ids are positions within the message
          items:
            $ref: '#/components/schemas/ReportBlockDto'
        sources:
          type: array
          description: ASSISTANT - the cited sources, once per marker
          items:
            $ref: '#/components/schemas/ReportSourceDto'
        mentions:
          type: array
          description: ASSISTANT - the records and emails the answer is about
          items:
            $ref: '#/components/schemas/ChatMentionDto'
        error:
          type: string
          description: FAILED - why, in words for the user
        createdAt:
          type: string
          format: date-time
    ChatConversationDto:
      type: object
      required: [id, title, messages, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        messages:
          type: array
          description: Questions and answers in order
          items:
            $ref: '#/components/schemas/ChatMessageDto'
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    ChatConversationSummaryDto:
      type: object
      required: [id, title, answering, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        answering:
          type: boolean
          description: An answer is still being written
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    NewChatMessageCommand:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The question
        recordRefs:
          type: array
          maxItems: 10
          description: Records the question is about (picked with @); the answer uses them besides what it looks up
          items:
            $ref: '#/components/schemas/RecordRefDto'
    UpdateChatConversationCommand:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 120
          description: The new title; `null` = unchanged
    ApiAuthType:
      type: string
      description: |
        How contor authenticates to an app, and which settings (`ApiAuthConfigDto`) and secret it needs. NONE: nothing.
        API_KEY_HEADER: `headerName` + the key as secret. API_KEY_QUERY: `queryParam` + the key. BEARER: the token.
        BASIC: `username` + the password. OAUTH2_CLIENT_CREDENTIALS: `tokenUrl`, `clientId`, optional `scope` + the
        client secret (the token is fetched and renewed by contor).
      enum: [NONE, API_KEY_HEADER, API_KEY_QUERY, BEARER, BASIC, OAUTH2_CLIENT_CREDENTIALS]
    ApiState:
      type: string
      description: |
        ACTIVE: called on its interval. FAILING: the last calls failed; still called, with growing pauses. PAUSED:
        too many failures; not called until you change the app. NEEDS_SETUP: the credentials were rejected (401/403).
      enum: [ACTIVE, FAILING, PAUSED, NEEDS_SETUP]
    EndpointMethod:
      type: string
      description: GET, or POST for read queries only (search, GraphQL)
      enum: [GET, POST]
    EndpointOrigin:
      type: string
      description: Who added the endpoint, you or the documentation (parsed or read by the model)
      enum: [USER, DOCS, MODEL]
    ApiCallResult:
      type: string
      description: "OK: a new answer. UNCHANGED: the same answer as last time. FAILED: no usable answer (see `error`)."
      enum: [OK, UNCHANGED, FAILED]
    ExternalApiCallDto:
      type: object
      description: One call of an endpoint
      required: [id, endpointId, endpointName, startedAt, durationMs, outcome, itemsNew, itemsChanged, itemsGone]
      properties:
        id:
          type: integer
          format: int64
        endpointId:
          type: integer
          format: int64
        endpointName:
          type: string
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        httpStatus:
          type: integer
          description: Missing when no answer came (refused, timeout, network)
        outcome:
          $ref: '#/components/schemas/ApiCallResult'
        error:
          type: string
          description: What went wrong or why no items were read; never a URL or credential
        itemsNew:
          type: integer
        itemsChanged:
          type: integer
        itemsGone:
          type: integer
    DiscoveryState:
      type: string
      description: "RUNNING: the AI model is reading the docs. DONE: `endpoints` are the suggestions. FAILED: see `error`."
      enum: [RUNNING, DONE, FAILED]
    NewApiDiscoveryCommand:
      type: object
      required: [docsUrl, baseUrl]
      properties:
        docsUrl:
          type: string
          maxLength: 2000
        baseUrl:
          type: string
          maxLength: 2000
          description: Suggested paths are relative to it
        apiId:
          type: integer
          format: int64
          nullable: true
          description: An app of yours; its existing endpoints are not suggested again
    ApiDiscoveryDto:
      type: object
      required: [id, state, endpoints, startedAt]
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/DiscoveryState'
        source:
          $ref: '#/components/schemas/EndpointOrigin'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredEndpointDto'
        error:
          type: string
          description: Why nothing was found; never a credential
        startedAt:
          type: string
          format: date-time
    DiscoveredEndpointDto:
      type: object
      description: A suggested endpoint; add it with `POST /api/external-apis/{apiId}/endpoints` once confirmed
      required: [name, method, path, query, source]
      properties:
        name:
          type: string
        method:
          $ref: '#/components/schemas/EndpointMethod'
        path:
          type: string
        query:
          type: object
          additionalProperties:
            type: string
        itemsPath:
          type: string
        itemKeyPath:
          type: string
        description:
          type: string
        source:
          $ref: '#/components/schemas/EndpointOrigin'
    ApiAuthConfigDto:
      type: object
      description: The non-secret auth settings; which ones are needed depends on the auth kind (`ApiAuthType`)
      properties:
        headerName:
          type: string
          nullable: true
          maxLength: 100
        queryParam:
          type: string
          nullable: true
          maxLength: 100
        tokenUrl:
          type: string
          nullable: true
          maxLength: 2000
        scope:
          type: string
          nullable: true
          maxLength: 500
        username:
          type: string
          nullable: true
          maxLength: 500
        clientId:
          type: string
          nullable: true
          maxLength: 500
    ApiHeaderDto:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
          maxLength: 4000
    ExternalApiDto:
      type: object
      required: [id, name, slug, baseUrl, authKind, authConfig, hasSecret, headers, secretHeaderNames, pollIntervalMinutes,
                 enabled, aiAnalysis, status, failureCount, dailyRequestLimit, endpointCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        baseUrl:
          type: string
        docsUrl:
          type: string
        authKind:
          $ref: '#/components/schemas/ApiAuthType'
        authConfig:
          $ref: '#/components/schemas/ApiAuthConfigDto'
        hasSecret:
          type: boolean
          description: A secret (key, token, password, client secret) is stored; its value is never returned
        headers:
          type: array
          description: Plain headers sent with every call
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        secretHeaderNames:
          type: array
          description: Names of the secret headers; their values are never returned
          items:
            type: string
        pollIntervalMinutes:
          type: integer
        enabled:
          type: boolean
        aiAnalysis:
          type: boolean
          description: The assistant may learn from the answers
        status:
          $ref: '#/components/schemas/ApiState'
        lastCalledAt:
          type: string
          format: date-time
        nextCallAt:
          type: string
          format: date-time
        failureCount:
          type: integer
        lastError:
          type: string
          description: The last failure in words; never a URL or credential
        dailyRequestLimit:
          type: integer
        endpointCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    NewExternalApiCommand:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        baseUrl:
          type: string
          maxLength: 2000
          description: HTTPS, no query; endpoint paths are relative to it
        docsUrl:
          type: string
          maxLength: 2000
        authKind:
          $ref: '#/components/schemas/ApiAuthType'
        authConfig:
          $ref: '#/components/schemas/ApiAuthConfigDto'
        secret:
          type: string
          writeOnly: true
          maxLength: 8000
          description: The key, token, password or client secret; stored encrypted
        headers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        secretHeaders:
          type: array
          writeOnly: true
          maxItems: 20
          description: Headers whose values are stored encrypted and never returned
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        pollIntervalMinutes:
          type: integer
          minimum: 15
          maximum: 10080
          description: Default 360 (6 hours)
        enabled:
          type: boolean
          description: Default true
        aiAnalysis:
          type: boolean
          description: Default true
        dailyRequestLimit:
          type: integer
          minimum: 1
          maximum: 10000
          description: Default 200
    UpdateExternalApiCommand:
      type: object
      description: '`null` = unchanged'
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: '`""` removes it'
        baseUrl:
          type: string
          nullable: true
          maxLength: 2000
        docsUrl:
          type: string
          nullable: true
          maxLength: 2000
          description: '`""` removes it'
        authKind:
          $ref: '#/components/schemas/ApiAuthType'
        authConfig:
          $ref: '#/components/schemas/ApiAuthConfigDto'
        secret:
          type: string
          nullable: true
          writeOnly: true
          maxLength: 8000
          description: '`""` removes the stored secret'
        headers:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        secretHeaders:
          type: array
          nullable: true
          writeOnly: true
          maxItems: 20
          description: Replaces all secret headers; `[]` removes them
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        pollIntervalMinutes:
          type: integer
          nullable: true
          minimum: 15
          maximum: 10080
        enabled:
          type: boolean
          nullable: true
        aiAnalysis:
          type: boolean
          nullable: true
        dailyRequestLimit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
    ExternalApiEndpointDto:
      type: object
      required: [id, apiId, name, method, path, query, source, enabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        apiId:
          type: integer
          format: int64
        name:
          type: string
        method:
          $ref: '#/components/schemas/EndpointMethod'
        path:
          type: string
        query:
          type: object
          additionalProperties:
            type: string
        body:
          type: object
          additionalProperties: {}
          description: The JSON body of a POST read query
        itemsPath:
