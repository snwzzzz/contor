      enum: [USER, AI]
    CollectionFieldType:
      type: string
      description: |
        Closed set of field types and their JSON value shapes:
        TEXT, LONG_TEXT, URL, EMAIL, PHONE, FILE: string ·
        NUMBER: number · MONEY: `{"amount": number, "currency": "EUR"}` ·
        DATE: `YYYY-MM-DD` · DATETIME: ISO-8601 with offset (returned in UTC) · BOOLEAN: boolean ·
        ENUM, STATUS: one of the configured values (string) · RELATION: id (integer) of a record in the target collection.
      enum: [TEXT, LONG_TEXT, NUMBER, MONEY, DATE, DATETIME, BOOLEAN, ENUM, STATUS, URL, EMAIL, PHONE, RELATION, FILE]
