          type: object
          additionalProperties: {}
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    UpdateRelationCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        attributes:
          type: object
          additionalProperties: {}
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    ProposalAction:
      type: string
      description: |
        What a proposal does when applied. Payloads (phase 1 appliers):
        CREATE_RECORD `{"collectionId": 1, "title": "..", "status": "..", "values": {..}, "extra": {..}}` ·
        UPDATE_RECORD `{"collectionId": 1, "recordId": 5, "title": "..", "status": "..", "values": {..}, "extra": {..}}` ·
        CREATE_COLLECTION: a NewCollectionCommand (`{"slug", "name", "description", "icon", "matchKeys", "displayConfig",
        "fields": [..]}`), created with createdBy AI; OWNER only ·
        CREATE_RELATION `{"relationTypeId": 3, "from": END, "to": END}` where END is `{"collectionId": 1, "recordId": 5}`
        (an existing record) or `{"proposalId": 21}` (the record that proposal created, read from its `result`; the
        proposal is a dependency, so the relation can only be approved once it is applied). Validated like a manual
        relation (type collections, records exist); created as AI with the source email and the proposal's confidence;
        an identical existing relation is a no-op (the proposal is applied and its result names the existing relation).
        DRAFT_REPLY `{"emailId": 8, "accountId": 1, "conversationId": "..", "to": [{"name": "..", "address": ".."}],
        "cc": [..], "subject": "Re: ..", "body": "plain text", "language": "de", "placeholders": ["[available times]"]}`:
        a reply the assistant wrote for the source email (`to` = its sender, `cc` = its Cc without your own addresses;
        `placeholders` are the `[...]` parts you still have to fill in; optional since reply-v2: `intent` = what the reply
        does (SCHEDULE, ANSWER_QUESTIONS, CONFIRM, DECLINE, PROVIDE_INFO, COURTESY = an optional polite reply to an email
        that needs no answer, with `courtesyKind` REJECTION_THANKS, DECLINE_OFFER, THANK_YOU, CONGRATULATE or
        KEEP_IN_TOUCH; only with the courtesyReplies setting, always LOW importance), `questions` = `[{"question": "..", "answered":
        true|false|null}]` the questions of the email and whether the draft answers them (false = left as a placeholder,
        null = not reported), `proposedSlots` = `[{"start": "ISO-8601", "end": "ISO-8601"}]` the free times from your
        calendar the draft offers). Approving keeps it as a reply draft (never
        sent, nothing is written to the mailbox); it needs `to` and `body`, and the email must be in your mailboxes.
        A pending draft is rejected automatically when you answer in Outlook or a newer email arrives in the conversation.
        Applying stores a `result` on every applied proposal (CREATE_RECORD/UPDATE_RECORD: `{"collectionId", "recordId"}`,
        CREATE_COLLECTION: `{"collectionId"}`, CREATE_RELATION: `{"relationId", "created"}`, DRAFT_REPLY: `{"replyDraftId"}`);
        a proposal the system rejected carries `{"reason"}`.
        INSIGHT `{"insightKey": "unanswered:42", "title": "..", "observation": "..", "whyItMatters": "..",
        "evidenceEmailIds": [42], "evidenceApiItemIds": [9], "followUps": [{"collectionId": 4, "title": "..", "values": {"due_date": "2026-10-13"}}],
        "source": "rule:unanswered-question" | "rule:clash" | "rule:gone-item" | "model"}`: something that only shows across several emails
        or between your mail and your apps' data (`evidenceApiItemIds`: items of your apps, e.g. a job posting that disappeared;
        missing in insights before insight-v2).
        Approving creates the follow-ups left in the (edited) payload as records linked to the evidence emails (result
        `{"records": [{"collectionId", "recordId"}]}`); an insight is proposed once per key, also after it was dismissed.
        MAP_API_ENDPOINT `{"mappingId": 40, "endpointId": 30, "collectionId": 4, "title": "Shop · Orders", "titlePath": "$.number", "fields":
        [{"fieldSlug": "total", "path": "$.total"}]}`: how the items of one of your apps' endpoints become records of a
        collection (paths in the external API JSON path subset, relative to an item). Approving (edits allowed: another
        collection, other fields) makes the mapping active and switches the endpoint's previous one off; then each item
        without a record becomes a CREATE_RECORD proposal, and later changes of an item an UPDATE_RECORD, following the
        `externalApis` setting (result `{"mappingId", "endpointId"}`). Record proposals from an app carry no source email.
        Other kinds are stored but cannot be applied yet.
      enum: [CREATE_RECORD, UPDATE_RECORD, CREATE_RELATION, SET_LABEL, ARCHIVE_EMAIL, DRAFT_REPLY, CREATE_COLLECTION, ADD_FIELD, CREATE_RULE, CREATE_LABEL, INSIGHT, MAP_API_ENDPOINT]
    ProposalState:
      type: string
      enum: [PENDING, APPROVED, EDITED_AND_APPROVED, REJECTED, AUTO_APPLIED, UNDONE, FAILED]
    ProposalGroup:
      type: string
      description: |
        FINDINGS: data the AI extracted (CREATE_RECORD / UPDATE_RECORD in any collection except the assistant's
        calendar `events` and to-dos `tasks`). ACTIONS: everything else – things the AI proposes to do (calendar
        entries, to-dos, new categories, reply drafts, later labels).
      enum: [ACTIONS, FINDINGS]
    ProposalPriority:
      type: string
      description: |
        How much a proposal deserves attention, derived from importanceScore: LOW < 35 <= NORMAL < 60 <= HIGH < 80 <= URGENT.
        The score comes from rules (no model call): the kind (a reply someone waits for > a to-do > an appointment > a new
        category > a finding > a relation), a deadline or date in the payload (within 2 days +25, within 7 days +10, past -20),
        the reply triage's urgency (high +20, low -10), a sender among your contacts (+10) or someone you wrote to (+10), a
        bulk sender (-30).
      enum: [LOW, NORMAL, HIGH, URGENT]
    ProposalSort:
      type: string
      enum: [NEWEST, IMPORTANCE]
    ProposalDecision:
      type: string
      enum: [APPROVE, REJECT]
    ProposalDto:
      type: object
      required: [id, kind, status, payload, importance, importanceScore, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ProposalAction'
        status:
          $ref: '#/components/schemas/ProposalState'
        payload:
          type: object
          description: What was proposed
          additionalProperties: {}
        finalPayload:
          type: object
          description: What was actually applied
          additionalProperties: {}
        sourceEmailId:
          type: integer
          format: int64
        confidence:
          type: number
        reasoning:
          type: string
        importance:
          $ref: '#/components/schemas/ProposalPriority'
        importanceScore:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        importanceReason:
          type: string
          description: Why it got its importance, e.g. "a to-do; due within 2 days" (absent for proposals never scored)
        model:
          type: string
        promptVersion:
          type: string
        schemaVersion:
          type: integer
          format: int32
        decidedAt:
          type: string
          format: date-time
        decidedById:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
