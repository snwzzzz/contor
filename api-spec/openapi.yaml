    ProposalAction:
      type: string
      description: |
        What a proposal does when applied. Payloads (phase 1 appliers):
        CREATE_RECORD `{"collectionId": 1, "title": "..", "status": "..", "values": {..}, "extra": {..}}` ·
        UPDATE_RECORD `{"collectionId": 1, "recordId": 5, "title": "..", "status": "..", "values": {..}, "extra": {..}}` ·
        CREATE_COLLECTION: a NewCollectionCommand (`{"slug", "name", "description", "icon", "matchKeys", "displayConfig",
        "fields": [..]}`), created with createdBy AI; OWNER only ·
        CREATE_RELATION `{"relationTypeId": 3, "from": END, "to": END}` where END is `{"collectionId": 1, "recordId": 5}`
        (an existing record) or `{"proposalId": 21}` (the record that proposal created, read from its `result`; the
        proposal is a dependency, so the relation can only be approved once it is applied). Validated like a manual
        relation (type collections, records exist); created as AI with the source email and the proposal's confidence;
        an identical existing relation is a no-op (the proposal is applied and its result names the existing relation).
        Applying stores a `result` on every applied proposal (CREATE_RECORD/UPDATE_RECORD: `{"collectionId", "recordId"}`,
        CREATE_COLLECTION: `{"collectionId"}`, CREATE_RELATION: `{"relationId", "created"}`).
        Other kinds are stored but cannot be applied yet.
      enum: [CREATE_RECORD, UPDATE_RECORD, CREATE_RELATION, SET_LABEL, ARCHIVE_EMAIL, DRAFT_REPLY, CREATE_COLLECTION, ADD_FIELD, CREATE_RULE, CREATE_LABEL]
    ProposalState:
      type: string
      enum: [PENDING, APPROVED, EDITED_AND_APPROVED, REJECTED, AUTO_APPLIED, UNDONE, FAILED]
    ProposalGroup:
      type: string
      description: |
        FINDINGS: data the AI extracted (CREATE_RECORD / UPDATE_RECORD in any collection except the assistant's
        calendar `events` and to-dos `tasks`). ACTIONS: everything else – things the AI proposes to do (calendar
        entries, to-dos, new categories, later replies and labels).
      enum: [ACTIONS, FINDINGS]
    ProposalDecision:
      type: string
      enum: [APPROVE, REJECT]
    ProposalDto:
      type: object
      required: [id, kind, status, payload, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ProposalAction'
        status:
          $ref: '#/components/schemas/ProposalState'
        payload:
          type: object
          description: What was proposed
          additionalProperties: {}
        finalPayload:
          type: object
          description: What was actually applied
          additionalProperties: {}
        sourceEmailId:
          type: integer
          format: int64
        confidence:
          type: number
        reasoning:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        schemaVersion:
          type: integer
          format: int32
        decidedAt:
          type: string
          format: date-time
        decidedById:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
