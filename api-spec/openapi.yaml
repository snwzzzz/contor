    post:
      tags: [Mail]
      operationId: connectMailAccount
      summary: Initiate the OAuth2 sign-in (with PKCE) of a mail provider. Returns the authorization URL. OWNER only.
      description: |
        `provider` picks the mail provider (default MICROSOFT_GRAPH). 400 when the provider is DEMO or not configured
        on this server (see GET /api/mail/providers).
      requestBody:
        required: false
        content:
          application/json:
