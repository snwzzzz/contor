        itemKeyPath:
          type: string
          description: The key that identifies an item across calls, relative to the item, e.g. `$.id`
        description:
          type: string
        source:
          $ref: '#/components/schemas/EndpointOrigin'
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    NewExternalApiEndpointCommand:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        method:
          $ref: '#/components/schemas/EndpointMethod'
        path:
          type: string
          maxLength: 1000
          description: Relative to the base URL, starting with `/`; no query
        query:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
        body:
          type: object
          additionalProperties: {}
          description: POST only
        itemsPath:
          type: string
          maxLength: 200
        itemKeyPath:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        enabled:
          type: boolean
          description: Default true
    UpdateExternalApiEndpointCommand:
      type: object
      description: '`null` = unchanged'
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        method:
          $ref: '#/components/schemas/EndpointMethod'
        path:
          type: string
          nullable: true
          maxLength: 1000
        query:
          type: object
          nullable: true
          maxProperties: 30
          additionalProperties:
            type: string
        body:
          type: object
          nullable: true
          additionalProperties: {}
          description: POST only; `{}` sends an empty object
        itemsPath:
          type: string
          nullable: true
          maxLength: 200
          description: '`""` removes it'
        itemKeyPath:
          type: string
          nullable: true
          maxLength: 200
          description: '`""` removes it'
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: '`""` removes it'
        enabled:
          type: boolean
          nullable: true
    TestExternalApiCommand:
      type: object
      required: [baseUrl, path]
      properties:
        apiId:
          type: integer
          format: int64
          nullable: true
          description: An app of yours whose stored secret and secret headers fill in the missing ones
        baseUrl:
          type: string
          maxLength: 2000
        authKind:
          $ref: '#/components/schemas/ApiAuthType'
        authConfig:
          $ref: '#/components/schemas/ApiAuthConfigDto'
        secret:
          type: string
          writeOnly: true
          maxLength: 8000
        headers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        secretHeaders:
          type: array
          writeOnly: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApiHeaderDto'
        method:
          $ref: '#/components/schemas/EndpointMethod'
        path:
          type: string
          maxLength: 1000
        query:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
        body:
          type: object
          additionalProperties: {}
    ApiTestResultDto:
      type: object
      required: [ok, bodyTruncated, durationMs]
      properties:
        ok:
          type: boolean
          description: The endpoint answered with a 2xx status
        status:
          type: integer
          description: The HTTP status; missing when no answer came
        contentType:
          type: string
        body:
          type: string
          description: The start of the answer (at most 20 000 characters)
        bodyTruncated:
          type: boolean
          description: The answer is longer than `body`
        durationMs:
          type: integer
        error:
          type: string
          description: Why the call failed (refused host, network, credentials); never a URL or credential
