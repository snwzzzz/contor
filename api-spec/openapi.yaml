      operationId: listEmails
      summary: Emails of the current user's mailboxes, newest first
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: labelId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: processingState
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmailProcessingState'
        - name: q
          in: query
          required: false
          description: Case-insensitive search text, matched in the parts named by `field`
          schema:
            type: string
            maxLength: 200
        - name: field
          in: query
          required: false
          description: Where `q` is searched (default ALL)
          schema:
            $ref: '#/components/schemas/EmailSearchField'
        - name: answered
          in: query
          required: false
          description: >
            true: only emails the user already answered (a newer sent message in the same conversation);
            false: only emails not answered yet; omitted: all. Ignored for the SENT folder.
          schema:
            type: boolean
        - name: folder
          in: query
          required: false
          description: INBOX (default) or SENT (the user's own sent mail, Sent Items)
          schema:
            $ref: '#/components/schemas/EmailFolder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of emails (summaries without bodies)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPageDto'
