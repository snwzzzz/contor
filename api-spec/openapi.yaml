      operationId: listSenderLogos
      summary: Which of the given sender domains have a logo
      description: |
        Unknown or stale domains are first fetched by the backend from https://<domain> (apple-touch-icon, favicon;
        public hosts only, raster images only) and cached: found logos for 30 days, misses for 7 days. Invalid domains
        are ignored. At most 100 domains per request.
      parameters:
        - name: domain
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 253
      responses:
        '200':
          description: The requested domains that have a logo, lower case
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
