        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/mail/accounts/callback:
    get:
      tags: [Mail]
      operationId: mailAccountCallback
      summary: OAuth2 callback of every mail provider (Microsoft Entra ID, Google). Exchanges the authorization code for tokens and forwards to the web app.
      description: |
        One redirect URI for all providers: the encrypted `state` names the provider and carries the PKCE verifier.
        Always answers with a small HTML page that forwards the browser (meta refresh) to `APP_WEB_URL/settings/accounts?connected=true`.
        Not a 302: the browser arrives from the provider, so a redirect chain stays cross-site and the SameSite=Strict
        session cookie would not be sent; a forward started by this localhost page is same-site.
        Failures (sign-in cancelled, expired state, token exchange) forward to `/settings/accounts?mailError=<message>`.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: HTML page forwarding the browser to the web app's account settings
          content:
            text/html:
              schema:
                type: string
