      operationId: connectMailAccount
      summary: Initiate OAuth2 connection for Microsoft Graph. Returns the authorization URL. OWNER only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectMailAccountCommand'
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
