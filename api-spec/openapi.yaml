          type: integer
          format: int64
    post:
      tags: [ReplyDrafts]
      operationId: suggestReply
      summary: Ask the assistant for a reply draft to this email (on demand, in the background)
      description: |
        Queues one draft call on the AI thread; the candidate rules and the triage call are skipped because you asked.
        The result is a pending DRAFT_REPLY proposal (it replaces an older pending one of the conversation). Poll
        `GET /api/emails/{emailId}/thread` (`replySuggestion` RUNNING, then IDLE or FAILED). 409 when mail access or
        reply drafts are turned off in the AI settings, or when the email is one of your own sent messages.
      responses:
        '202':
          description: Queued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reply-drafts/{replyDraftId}:
    parameters:
      - $ref: '#/components/parameters/ReplyDraftId'
    patch:
      tags: [ReplyDrafts]
      operationId: updateReplyDraft
      summary: Edit a kept reply draft (partial update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReplyDraftCommand'
      responses:
        '200':
          description: The updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyDraftDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reply-drafts/{replyDraftId}/discard:
    parameters:
      - $ref: '#/components/parameters/ReplyDraftId'
    post:
      tags: [ReplyDrafts]
      operationId: discardReplyDraft
      summary: Discard a kept reply draft (it disappears from the thread)
      responses:
        '200':
          description: The discarded draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyDraftDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/emails/{emailId}:
    parameters:
      - name: emailId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mail]
      operationId: getEmail
      summary: One email with bodies
      responses:
        '200':
          description: The email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/status:
    get:
      tags: [AI]
      operationId: getAiStatus
      summary: Whether the local Ollama is reachable and the configured models are installed
      responses:
        '200':
          description: Current status (never fails when Ollama is down; `reachable` is false then)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/models/pull:
    post:
      tags: [AI]
      operationId: pullAiModels
      summary: Start downloading every configured model that is not installed yet (background). OWNER only.
      responses:
        '202':
          description: Downloads started; poll GET /api/ai/status for progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/settings:
    get:
      tags: [AI]
      operationId: getAiSettings
      summary: The current user's AI permissions (defaults until the setup wizard saved them)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [AI]
      operationId: updateAiSettings
      summary: Change AI permissions (partial update). OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsCommand'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/ai/analysis:
    post:
      tags: [AI]
      operationId: startAnalysis
      summary: Start the inbox analysis (discovery, then extraction) in the background. OWNER only.
      description: |
        409 when a run is already active, mail access is not granted, or the models are not ready.
      responses:
        '201':
          description: The queued run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/insights:
    get:
      tags: [AI]
      operationId: getInsightRun
      summary: Whether a requested insight pass of the current user is still running
      responses:
        '200':
          description: The state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [AI]
      operationId: requestInsights
      summary: Look for insights now (in the background, on the AI thread)
      description: |
        Insights are what only shows across several emails (an unanswered question, overlapping appointments, what the
        model notices in the last two weeks). They also run daily. New ones arrive as INSIGHT proposals.
      responses:
        '202':
          description: Queued (or already queued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/analysis/latest:
    get:
      tags: [AI]
      operationId: getLatestAnalysis
      summary: The current user's most recent analysis run
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/analysis/{runId}/continue:
    parameters:
      - $ref: '#/components/parameters/AnalysisRunId'
    post:
      tags: [AI]
      operationId: continueAnalysis
      summary: Continue a run waiting for the review of discovered categories (starts extraction). OWNER only.
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/analysis/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AnalysisRunId'
    post:
      tags: [AI]
      operationId: cancelAnalysis
      summary: Stop an active run after the email currently being analyzed. OWNER only.
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/eval/export:
    get:
      tags: [AI]
      operationId: exportEvalCases
      summary: Export emails with their decided AI proposals as extraction eval cases. OWNER only.
      description: |
        For each of the owner's own emails: the email as the extraction model sees it, `expected` built from the
        proposals that were applied (CREATE_RECORD, using the final payload, i.e. including the user's corrections),
        and `mustNotProduce` from the rejected CREATE_RECORD proposals. Correct the findings in the UI, export, and
        save the result as JSON files in the git-ignored `ai-eval/private/` folder. Emails of other users are skipped.
      parameters:
        - name: emailIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: One case per found email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalCaseExportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AnalysisRunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationTypeId:
      name: relationTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReplyDraftId:
      name: replyDraftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SavedQueryId:
      name: savedQueryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MailAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CONTOR_SESSION
  responses:
    BadRequest:
      description: Invalid input (all validation failures in one message)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not authenticated, or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Missing/invalid CSRF token, invalid setup token, or not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate (e.g. slug or unique field value already taken)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Uniform error body for every non-2xx response. Never contains stack traces or internals.
      required: [message, status]
      properties:
        message:
          type: string
        status:
          type: integer
          format: int32
    VersionDto:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
    Role:
      type: string
      enum: [OWNER, USER]
    CurrentUserDto:
      type: object
      required: [id, username, email, role, totpEnabled]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        totpEnabled:
          type: boolean
    LoginCommand:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    ChangePasswordCommand:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          description: 12-128 characters with lowercase, uppercase, digit and special character; not a common password.
          maxLength: 128
    SetupStatusDto:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
    SetupCommand:
      type: object
      required: [token, username, email, password]
      properties:
        token:
          type: string
          description: One-time setup token printed to the backend log on startup.
          maxLength: 128
        username:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 254
        password:
          type: string
          description: 12-128 characters with lowercase, uppercase, digit and special character; not a common password.
          maxLength: 128
    Creator:
      type: string
      description: Who defined a collection, field set or relation type.
      enum: [USER, AI]
    CollectionFieldType:
      type: string
      description: |
        Closed set of field types and their JSON value shapes:
        TEXT, LONG_TEXT, URL, EMAIL, PHONE, FILE: string ·
        NUMBER: number · MONEY: `{"amount": number, "currency": "EUR"}` ·
        DATE: `YYYY-MM-DD` · DATETIME: ISO-8601 with offset (returned in UTC) · BOOLEAN: boolean ·
        ENUM, STATUS: one of the configured values (string) · RELATION: id (integer) of a record in the target collection.
      enum: [TEXT, LONG_TEXT, NUMBER, MONEY, DATE, DATETIME, BOOLEAN, ENUM, STATUS, URL, EMAIL, PHONE, RELATION, FILE]
    DisplayConfigDto:
      type: object
      description: Default presentation. Field references are field slugs.
      properties:
        defaultView:
          type: string
          description: e.g. table, kanban, calendar
        kanbanStatusField:
          type: string
        calendarDateField:
          type: string
        titleField:
          type: string
    CollectionFieldDto:
      type: object
      required: [id, slug, name, type, options, required, uniqueValue, position]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/CollectionFieldType'
        options:
          type: object
          additionalProperties: {}
        required:
          type: boolean
        uniqueValue:
          type: boolean
        position:
          type: integer
          format: int32
        archivedAt:
          type: string
          format: date-time
    CollectionDto:
      type: object
      required: [id, slug, name, system, matchKeys, displayConfig, schemaVersion, createdBy, fields]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        system:
          type: boolean
          description: Seeded by contor (People, Organizations, Events, Tasks)
        matchKeys:
          type: array
          description: Field slugs used to recognise an existing record
          items:
            type: string
        displayConfig:
          $ref: '#/components/schemas/DisplayConfigDto'
        schemaVersion:
          type: integer
          format: int32
        createdBy:
          $ref: '#/components/schemas/Creator'
        archivedAt:
          type: string
          format: date-time
        fields:
          type: array
          description: Ordered by position
          items:
            $ref: '#/components/schemas/CollectionFieldDto'
    NewCollectionFieldCommand:
      type: object
      required: [slug, name, type]
      properties:
        slug:
          type: string
          description: '`^[a-z][a-z0-9_]{1,40}$`, not a reserved word, unique within the collection. Becomes the column name.'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Also used to explain the field to the AI.
          maxLength: 2000
        type:
          $ref: '#/components/schemas/CollectionFieldType'
        options:
          type: object
          description: |
            Type-specific: ENUM `{"values": [..]}` · STATUS `{"states": [..], "transitions": {"from": ["to", ..]}}`
            (ordered states; no transitions = any change allowed; a new record without status gets the first state) ·
            RELATION `{"targetCollectionId": 1}` · TEXT `{"maxLength": 500}` · NUMBER `{"min": 0, "max": 10}`.
          additionalProperties: {}
        required:
          type: boolean
          default: false
        uniqueValue:
          type: boolean
          default: false
    NewCollectionCommand:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: '`^[a-z][a-z0-9_]{1,40}$`, not a reserved word. The table is named `c_<slug>`.'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        icon:
          type: string
          maxLength: 100
        matchKeys:
          type: array
          items:
            type: string
        displayConfig:
          $ref: '#/components/schemas/DisplayConfigDto'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/NewCollectionFieldCommand'
    UpdateCollectionCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        icon:
          type: string
          maxLength: 100
        matchKeys:
          type: array
          items:
            type: string
        displayConfig:
          $ref: '#/components/schemas/DisplayConfigDto'
    RecordDto:
      type: object
      required: [id, collectionId, values, extra, createdAt, createdBy]
      properties:
        id:
          type: integer
          format: int64
          description: Unique only within its collection; reference records as (collectionId, id).
        collectionId:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        values:
          type: object
          description: Values of active fields keyed by field slug (see CollectionFieldType for shapes)
          additionalProperties: {}
        extra:
          type: object
          description: Values for fields that do not exist (yet)
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        createdBy:
          type: string
          description: USER, AI or SYSTEM
    RecordPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    NewRecordCommand:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        values:
          type: object
          description: Keyed by field slug. Unknown or archived fields are rejected.
          additionalProperties: {}
        extra:
          type: object
          additionalProperties: {}
    UpdateRecordCommand:
      type: object
      description: Partial update. null title/status/extra = unchanged; keys absent from values = unchanged, null value = clear.
      properties:
        title:
          type: string
        status:
          type: string
        values:
          type: object
          additionalProperties: {}
        extra:
          type: object
          description: Replaces extra when given.
          additionalProperties: {}
    LabelOrigin:
      type: string
      description: How a label got onto an email.
      enum: [MANUAL, RULE, AI]
    LabelDto:
      type: object
      required: [id, slug, name, color, createdBy]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        color:
          type: string
          description: '#RRGGBB'
        description:
          type: string
        createdBy:
          $ref: '#/components/schemas/Creator'
    NewLabelCommand:
      type: object
      required: [slug, name, color]
      properties:
        slug:
          type: string
          description: '`^[a-z][a-z0-9_]{1,40}$`, unique'
        name:
          type: string
          maxLength: 200
        color:
          type: string
          description: '#RRGGBB'
        description:
          type: string
          maxLength: 2000
    UpdateLabelCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        name:
          type: string
          maxLength: 200
        color:
          type: string
        description:
          type: string
          maxLength: 2000
    RuleDto:
      type: object
      required: [id, name, enabled, priority, conditions, actions]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
          format: int32
          description: Lower runs first
        conditions:
          type: object
          additionalProperties: {}
        actions:
          type: array
          items:
            type: object
            additionalProperties: {}
        createdFromProposalId:
          type: integer
          format: int64
    NewRuleCommand:
      type: object
      required: [name]
      description: Conditions/actions are stored as given; their format is defined with the rule engine in a later phase.
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          format: int32
          default: 100
        conditions:
          type: object
          additionalProperties: {}
        actions:
          type: array
          items:
            type: object
            additionalProperties: {}
    UpdateRuleCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
        priority:
          type: integer
          format: int32
        conditions:
          type: object
          additionalProperties: {}
        actions:
          type: array
          items:
            type: object
            additionalProperties: {}
    RelationOrigin:
      type: string
      enum: [USER, AI, RULE]
    RelationTypeDto:
      type: object
      required: [id, slug, name, directed, attributesSchema, createdBy]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
          description: Label from the source side, e.g. "works at"
        inverseName:
          type: string
          description: Label from the target side, e.g. "employs"
        fromCollectionId:
          type: integer
          format: int64
          description: Allowed source collection; absent = any
        toCollectionId:
          type: integer
          format: int64
          description: Allowed target collection; absent = any
        directed:
          type: boolean
        attributesSchema:
          type: object
          additionalProperties: {}
        createdBy:
          $ref: '#/components/schemas/Creator'
    NewRelationTypeCommand:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
          maxLength: 200
        inverseName:
          type: string
          maxLength: 200
        fromCollectionId:
          type: integer
          format: int64
        toCollectionId:
          type: integer
          format: int64
        directed:
          type: boolean
          default: true
        attributesSchema:
          type: object
          additionalProperties: {}
    UpdateRelationTypeCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        name:
          type: string
          maxLength: 200
        inverseName:
          type: string
          maxLength: 200
        attributesSchema:
          type: object
          additionalProperties: {}
    RelationDto:
      type: object
      required: [id, relationTypeId, fromCollectionId, fromRecordId, toCollectionId, toRecordId, attributes, createdBy]
      properties:
        id:
          type: integer
          format: int64
        relationTypeId:
          type: integer
          format: int64
        fromCollectionId:
          type: integer
          format: int64
