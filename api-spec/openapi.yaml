      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/eval/export:
    get:
      tags: [AI]
      operationId: exportEvalCases
      summary: Export emails with their decided AI proposals as extraction eval cases. OWNER only.
      description: |
        For each of the owner's own emails: the email as the extraction model sees it, `expected` built from the
        proposals that were applied (CREATE_RECORD, using the final payload, i.e. including the user's corrections),
        and `mustNotProduce` from the rejected CREATE_RECORD proposals. Correct the findings in the UI, export, and
        save the result as JSON files in the git-ignored `ai-eval/private/` folder. Emails of other users are skipped.
      parameters:
        - name: emailIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: One case per found email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalCaseExportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    AnalysisRunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationTypeId:
      name: relationTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SavedQueryId:
      name: savedQueryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MailAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CONTOR_SESSION
  responses:
    BadRequest:
      description: Invalid input (all validation failures in one message)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not authenticated, or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Missing/invalid CSRF token, invalid setup token, or not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate (e.g. slug or unique field value already taken)
      content:
