      tags: [Mail]
      operationId: getEmailThread
      summary: The conversation an email belongs to, in its mailbox, the user's own replies (Sent Items) included
      responses:
        '200':
          description: |
            The messages of the conversation, oldest first (just the email itself when it has no conversation), with
            the assistant's reply drafts for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadDto'
        '401':
