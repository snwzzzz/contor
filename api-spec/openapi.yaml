          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmailProcessingState'
        - name: q
          in: query
          required: false
          description: Case-insensitive search text, matched in the parts named by `field`
          schema:
            type: string
            maxLength: 200
        - name: field
          in: query
          required: false
          description: Where `q` is searched (default ALL)
          schema:
            $ref: '#/components/schemas/EmailSearchField'
        - name: answered
          in: query
          required: false
          description: >
            true: only emails the user already answered (a newer sent message in the same conversation);
            false: only emails not answered yet; omitted: all. Ignored for the SENT folder.
          schema:
            type: boolean
        - name: read
          in: query
          required: false
          description: "true: only emails the user has read; false: only unread ones (totalElements is the unread count); omitted: all"
          schema:
            type: boolean
        - name: folder
          in: query
          required: false
          description: INBOX (default) or SENT (the user's own sent mail, Sent Items)
          schema:
            $ref: '#/components/schemas/EmailFolder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of emails (summaries without bodies)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/emails/suggestions:
    get:
      tags: [Mail]
      operationId: suggestEmailSenders
      summary: Senders (people) and sender companies (domains) of the current user's inbox matching a prefix of the search box
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: folder
          in: query
          required: false
          description: SENT suggests the people you wrote to (recipients of your sent mail) instead of senders
          schema:
            $ref: '#/components/schemas/EmailFolder'

      responses:
        '200':
          description: Most frequent matching people first, then companies; at most a handful of each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailSuggestionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/emails/{emailId}/thread:
    parameters:
      - name: emailId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mail]
      operationId: getEmailThread
      summary: The conversation an email belongs to, in its mailbox, the user's own replies (Sent Items) included
      responses:
        '200':
          description: |
            The messages of the conversation, oldest first (just the email itself when it has no conversation), with
            the assistant's reply drafts for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/emails/{emailId}/paragraphs:
    parameters:
      - name: emailId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mail]
      operationId: getEmailParagraphs
      summary: The paragraphs of an email that report citations point at
      description: |
        The text body (or the HTML body as text) without quoted history, reply headers and signature, split into
        paragraphs: blank lines separate them, list items are paragraphs of their own, a short greeting joins the next
        paragraph, very long ones are split at a sentence end. A citation addresses a paragraph by `index` and keeps its
        `hash`, so it is still found when the splitting rules change.
      responses:
        '200':
          description: The paragraphs in order (empty when the email has no text)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailParagraphDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/emails/{emailId}/reply-suggestion:
    parameters:
      - name: emailId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [ReplyDrafts]
      operationId: suggestReply
      summary: Ask the assistant for a reply draft to this email (on demand, in the background)
      description: |
        Queues one draft call on the AI thread; the candidate rules and the triage call are skipped because you asked.
        The result is a pending DRAFT_REPLY proposal (it replaces an older pending one of the conversation). Poll
        `GET /api/emails/{emailId}/thread` (`replySuggestion` RUNNING, then IDLE or FAILED). 409 when mail access or
        reply drafts are turned off in the AI settings, or when the email is one of your own sent messages.
      responses:
        '202':
          description: Queued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reply-drafts/{replyDraftId}:
    parameters:
      - $ref: '#/components/parameters/ReplyDraftId'
    patch:
      tags: [ReplyDrafts]
      operationId: updateReplyDraft
      summary: Edit a kept reply draft (partial update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReplyDraftCommand'
      responses:
        '200':
          description: The updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyDraftDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reply-drafts/{replyDraftId}/discard:
    parameters:
      - $ref: '#/components/parameters/ReplyDraftId'
    post:
      tags: [ReplyDrafts]
      operationId: discardReplyDraft
      summary: Discard a kept reply draft (it disappears from the thread)
      responses:
        '200':
          description: The discarded draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyDraftDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/emails/{emailId}:
    parameters:
      - name: emailId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Mail]
      operationId: getEmail
      summary: One email with bodies
      responses:
        '200':
          description: The email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/status:
    get:
      tags: [AI]
      operationId: getAiStatus
      summary: Whether the local Ollama is reachable and the configured models are installed
      responses:
        '200':
          description: Current status (never fails when Ollama is down; `reachable` is false then)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/models/pull:
    post:
      tags: [AI]
      operationId: pullAiModels
      summary: Start downloading every configured model that is not installed yet (background). OWNER only.
      responses:
        '202':
          description: Downloads started; poll GET /api/ai/status for progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/settings:
    get:
      tags: [AI]
      operationId: getAiSettings
      summary: The current user's AI permissions (defaults until the setup wizard saved them)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [AI]
      operationId: updateAiSettings
      summary: Change AI permissions (partial update). OWNER only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsCommand'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/ai/analysis:
    post:
      tags: [AI]
      operationId: startAnalysis
      summary: Start the inbox analysis (discovery, then extraction) in the background. OWNER only.
      description: |
        409 when a run is already active, mail access is not granted, or the models are not ready.
      responses:
        '201':
          description: The queued run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/insights:
    get:
      tags: [AI]
      operationId: getInsightRun
      summary: Whether a requested insight pass of the current user is still running
      responses:
        '200':
          description: The state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [AI]
      operationId: requestInsights
      summary: Look for insights now (in the background, on the AI thread)
      description: |
        Insights are what only shows across several emails (an unanswered question, overlapping appointments, what the
        model notices in the last two weeks). They also run daily. New ones arrive as INSIGHT proposals.
      responses:
        '202':
          description: Queued (or already queued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ai/analysis/latest:
    get:
      tags: [AI]
      operationId: getLatestAnalysis
      summary: The current user's most recent analysis run
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/analysis/{runId}/continue:
    parameters:
      - $ref: '#/components/parameters/AnalysisRunId'
    post:
      tags: [AI]
      operationId: continueAnalysis
      summary: Continue a run waiting for the review of discovered categories (starts extraction). OWNER only.
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ai/analysis/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AnalysisRunId'
    post:
      tags: [AI]
      operationId: cancelAnalysis
      summary: Stop an active run after the email currently being analyzed. OWNER only.
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/chat/conversations:
    get:
      tags: [Chat]
      operationId: listChatConversations
      summary: Your chat conversations, most recently active first
      responses:
        '200':
          description: The conversations (without messages)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatConversationSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Chat]
      operationId: createChatConversation
      summary: Start a conversation with a first question; the answer is written in the background
      description: |
        Creates the conversation (titled after the question), the question and a PENDING answer. Poll
        `GET /api/chat/conversations/{conversationId}` until the answer is DONE or FAILED. 409 when the AI model is not
        ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewChatMessageCommand'
      responses:
        '201':
          description: Created, with the pending answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/chat/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ChatConversationId'
    get:
      tags: [Chat]
      operationId: getChatConversation
      summary: One of your conversations with its questions and answers
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Chat]
      operationId: updateChatConversation
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatConversationCommand'
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Chat]
      operationId: deleteChatConversation
      summary: Delete a conversation with its messages
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/chat/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatConversationId'
    post:
      tags: [Chat]
      operationId: askChatQuestion
      summary: Ask the next question of a conversation; the answer is written in the background
      description: 409 while the conversation's last answer is still being written, or when the AI model is not ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewChatMessageCommand'
      responses:
        '202':
          description: Queued; the conversation with the question and its pending answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/chat/conversations/{conversationId}/messages/{messageId}/retry:
    parameters:
      - $ref: '#/components/parameters/ChatConversationId'
      - $ref: '#/components/parameters/ChatMessageId'
    post:
      tags: [Chat]
      operationId: retryChatMessage
      summary: Write a FAILED answer again (only the conversation's last message)
      responses:
        '202':
          description: Queued; the conversation with the pending answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/external-apis:
    get:
      tags: [ExternalApis]
      operationId: listExternalApis
      summary: Your connected apps (external APIs) by name
      responses:
        '200':
          description: The apps; credentials are never returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalApiDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ExternalApis]
      operationId: createExternalApi
      summary: Connect an app
      description: |
        The app is private to you. Its slug is derived from the name (unique among your apps). The first call is due
        right away when the app is enabled and has endpoints. 400 when the URLs, headers or auth settings are invalid or
        the auth kind's settings or secret are missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExternalApiCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/external-apis/test:
    post:
      tags: [ExternalApis]
      operationId: testExternalApi
      summary: Call an endpoint once with settings that are not saved yet
      description: |
        Sends one request with the given settings and returns the start of the answer; nothing is stored. With
        `apiId`, a missing `secret` or `secretHeaders` falls back to that app's stored ones (editing without retyping
        them). The call goes through the same guard as polls: HTTPS on port 443, public hosts only. A refused or failed
        call is a 200 with `ok: false` and `error`; invalid settings are a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestExternalApiCommand'
      responses:
        '200':
          description: What the endpoint answered, or why the call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTestResultDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-apis/discovery:
    post:
      tags: [ExternalApis]
      operationId: startApiDiscovery
      summary: Read an app's documentation and suggest endpoints ("Read the docs")
      description: |
        Fetches `docsUrl` (public HTTPS only). An OpenAPI 3 or Swagger 2 document (JSON or YAML) is read in code and the
        answer is done at once; other documentation is read by the AI model in the background (state RUNNING, poll
        `GET …/discovery/{discoveryId}`). Suggestions are GET endpoints below `baseUrl`, at most 30; nothing is saved.
        With `apiId`, endpoints that app already has are left out. A refused or failed fetch, or a model that is not
        ready, is a FAILED discovery with `error`, not an error response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApiDiscoveryCommand'
      responses:
        '202':
          description: Started (or already done for an OpenAPI document)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscoveryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-apis/discovery/{discoveryId}:
    parameters:
      - name: discoveryId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      tags: [ExternalApis]
      operationId: getApiDiscovery
      summary: A discovery you started, while it runs and for an hour after
      responses:
        '200':
          description: The discovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscoveryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-apis/{apiId}:
    parameters:
      - $ref: '#/components/parameters/ExternalApiId'
    get:
      tags: [ExternalApis]
      operationId: getExternalApi
      summary: One of your apps
      responses:
        '200':
          description: The app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ExternalApis]
      operationId: updateExternalApi
      summary: Change an app
      description: |
        `null` fields stay unchanged. `secret: ""` removes the stored secret; `secretHeaders` replaces all secret
        headers (`[]` removes them). Any change clears the failure state (status ACTIVE, failure count 0) and, when the
        app is enabled, makes the next call due right away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalApiCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ExternalApis]
      operationId: deleteExternalApi
      summary: Disconnect an app
      description: Removes the app, its endpoints, call history, answers and items. Records made from them stay.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-apis/{apiId}/endpoints:
    parameters:
      - $ref: '#/components/parameters/ExternalApiId'
    get:
      tags: [ExternalApis]
      operationId: listExternalApiEndpoints
      summary: The confirmed endpoints of one of your apps, by name
      responses:
        '200':
          description: The endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalApiEndpointDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ExternalApis]
      operationId: createExternalApiEndpoint
      summary: Add an endpoint contor may call
      description: |
        Only GET, and POST for read queries (search, GraphQL). The path is relative to the app's base URL. 409 when the
        app already has an endpoint of that name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExternalApiEndpointCommand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiEndpointDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/external-apis/{apiId}/endpoints/{endpointId}:
    parameters:
      - $ref: '#/components/parameters/ExternalApiId'
      - $ref: '#/components/parameters/ExternalApiEndpointId'
    patch:
      tags: [ExternalApis]
      operationId: updateExternalApiEndpoint
      summary: Change an endpoint
      description: |
        `null` fields stay unchanged; `""` removes `itemsPath`, `itemKeyPath` or `description`. 409 when another
        endpoint of the app has the new name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalApiEndpointCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiEndpointDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [ExternalApis]
      operationId: deleteExternalApiEndpoint
      summary: Remove an endpoint with its call history, answers and items
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/external-apis/{apiId}/calls:
    parameters:
      - $ref: '#/components/parameters/ExternalApiId'
    get:
      tags: [ExternalApis]
      operationId: listExternalApiCalls
      summary: The app's last 50 calls across its endpoints, newest first (kept for 30 days)
      responses:
        '200':
          description: The calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalApiCallDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ExternalApis]
      operationId: callExternalApiNow
      summary: Call the app with the next poll, without waiting for its interval
      description: |
        The app is called within the next minute, through the same checks and the same daily request limit. A paused
        app or one that needs setup is set to ACTIVE first. 409 when the app is turned off.
      responses:
        '202':
          description: Queued; the app with its next call due now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalApiDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/ai/eval/export:
    get:
      tags: [AI]
      operationId: exportEvalCases
      summary: Export emails with their decided AI proposals as extraction eval cases. OWNER only.
      description: |
        For each of the owner's own emails: the email as the extraction model sees it, `expected` built from the
        proposals that were applied (CREATE_RECORD, using the final payload, i.e. including the user's corrections),
        and `mustNotProduce` from the rejected CREATE_RECORD proposals. Correct the findings in the UI, export, and
        save the result as JSON files in the git-ignored `ai-eval/private/` folder. Emails of other users are skipped.
      parameters:
        - name: emailIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: One case per found email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalCaseExportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    ExternalApiId:
      name: apiId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExternalApiEndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChatConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChatMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AnalysisRunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationTypeId:
      name: relationTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReplyDraftId:
      name: replyDraftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SavedQueryId:
      name: savedQueryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MailAccountId:
      name: accountId
      in: path
