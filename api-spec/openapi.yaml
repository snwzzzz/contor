        reachable:
          type: boolean
          description: Ollama answered on its (loopback) base URL
        version:
          type: string
        ready:
          type: boolean
          description: Reachable and every configured model installed
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModelDto'
    AiAccess:
      type: string
      description: OFF = the AI never touches this area · SUGGEST = proposals for review · AUTO = applied directly.
      enum: ['OFF', SUGGEST, AUTO]
    AiSettingsDto:
      type: object
      required: [mailAccess, historyDays, categories, records, calendar, tasks]
      properties:
        mailAccess:
          type: boolean
          description: The AI may read and analyze the user's mailboxes (master switch)
        historyDays:
          type: integer
          format: int32
          description: How many days back the inbox analysis reads; 0 = everything
        categories:
          $ref: '#/components/schemas/AiAccess'
        records:
          $ref: '#/components/schemas/AiAccess'
        calendar:
          $ref: '#/components/schemas/AiAccess'
        tasks:
          $ref: '#/components/schemas/AiAccess'
        onboardedAt:
          type: string
          format: date-time
          description: When the setup wizard was completed; new mail is only processed afterwards
    UpdateAiSettingsCommand:
      type: object
      description: Partial update; null = unchanged.
      properties:
        mailAccess:
          type: boolean
        historyDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 3650
        categories:
          $ref: '#/components/schemas/AiAccess'
        records:
          $ref: '#/components/schemas/AiAccess'
        calendar:
          $ref: '#/components/schemas/AiAccess'
        tasks:
          $ref: '#/components/schemas/AiAccess'
        completeOnboarding:
          type: boolean
          description: true marks the setup wizard as completed (sets onboardedAt once)
    AnalysisState:
      type: string
      description: |
        QUEUED → DISCOVERING → (AWAITING_REVIEW when discovered categories need approval) → EXTRACTING → COMPLETED;
        FAILED or CANCELLED end a run early.
      enum: [QUEUED, DISCOVERING, AWAITING_REVIEW, EXTRACTING, COMPLETED, FAILED, CANCELLED]
    EvalCaseExportDto:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/EvalCaseDto'
    EvalCaseDto:
      type: object
      description: One labelled email of the extraction evaluation (the file format of `ai-eval/**/*.json`).
      required: [id, email, expected, mustNotProduce]
      properties:
        id:
          type: string
        email:
          $ref: '#/components/schemas/EvalEmailDto'
        expected:
          $ref: '#/components/schemas/EvalExpectedDto'
        mustNotProduce:
          type: array
          items:
            $ref: '#/components/schemas/EvalForbiddenDto'
    EvalEmailDto:
      type: object
      required: [mailbox, fromAddress, to, subject, receivedAt, body]
      properties:
        mailbox:
          type: string
        fromName:
          type: string
          nullable: true
        fromAddress:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        receivedAt:
          type: string
          format: date-time
        body:
          type: string
    EvalExpectedDto:
      type: object
      required: [records]
      properties:
        records:
          type: object
          description: Expected records per collection slug.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/EvalRecordDto'
    EvalRecordDto:
      type: object
      required: [title, values]
      properties:
        title:
          type: string
        values:
          type: object
          additionalProperties: true
    EvalForbiddenDto:
      type: object
      required: [collection]
      properties:
        collection:
          type: string
        title:
          type: string
          nullable: true
    AnalysisRunDto:
      type: object
      required: [id, status, discoverySteps, discoveryStepsDone, totalEmails, processedEmails, failedEmails, proposalsCreated, autoApplied, categoriesDiscovered, createdAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AnalysisState'
        since:
          type: string
          format: date-time
          description: Oldest email included; absent = everything
        discoverySteps:
          type: integer
          format: int32
          description: Model calls the category discovery needs (one per batch of emails plus one merge); 0 before it starts
        discoveryStepsDone:
          type: integer
          format: int32
        currentEmailSubject:
          type: string
          description: Subject of the email the model is reading right now (EXTRACTING only)
        currentEmailFrom:
          type: string
          description: Sender name (or address) of that email
        totalEmails:
          type: integer
          format: int32
        processedEmails:
          type: integer
          format: int32
        failedEmails:
          type: integer
          format: int32
        proposalsCreated:
          type: integer
          format: int32
          description: Proposals waiting for review
        autoApplied:
          type: integer
          format: int32
          description: Changes applied directly (AUTO permissions)
        categoriesDiscovered:
          type: integer
          format: int32
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
