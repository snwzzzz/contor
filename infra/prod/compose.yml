# The personal production instance: Postgres, backend and web in one compose project, next to the dev setup.
# Started by scripts/prod.sh from a clean export of main (.prod-build/); its data lives in the contor-prod_pgdata volume.
#
# Only the web app is published, on 127.0.0.1. Backend and web share the network namespace of `net`: the backend listens
# on its loopback only, the web server proxies /api/* to it there, and the relay in `net` forwards that loopback's port
# 11434 to Ollama on the host, so the backend's rule "Ollama only on localhost" holds and Ollama stays bound to the host's
# localhost. The database is reachable only inside the project's network.
name: contor-prod

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contor}
      POSTGRES_USER: ${DB_USERNAME:-contor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.prod}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  net:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: ["tcp-listen:11434,bind=127.0.0.1,fork,reuseaddr", "tcp-connect:host.docker.internal:11434"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"

  backend:
    build:
      context: ../..
      dockerfile: infra/prod/backend.Dockerfile
    image: contor-prod-backend
    restart: unless-stopped
    network_mode: service:net
    env_file: ../../../.env.prod
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-contor}
      APP_BIND_ADDRESS: 127.0.0.1
      APP_PORT: 8080
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    depends_on:
      postgres:
        condition: service_healthy
      net:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 6

  web:
    build:
      context: ../..
      dockerfile: infra/prod/web.Dockerfile
    image: contor-prod-web
    restart: unless-stopped
    network_mode: service:net
    environment:
      CONTOR_HTTPS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  pgdata:
