# Dev profile: Swagger UI rendering the static contract (api-spec/openapi.yaml, copied to classpath:openapi/openapi.yaml,
# served by DevApiSpecConfig). springdoc needs api-docs enabled to serve the UI's config; the UI still shows our contract.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    url: /openapi.yaml
