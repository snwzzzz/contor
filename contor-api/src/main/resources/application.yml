spring:
  application:
    name: contor-api
  config:
    # Local dev: read the repo-root .env (KEY=value, no quotes) when started from contor-api (IntelliJ, ./mvnw).
    # Real environment variables still win.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/contor}
    username: ${DB_USERNAME:contor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db
  jackson:
    default-property-inclusion: non_null
  session:
    # Idle timeout; the absolute lifetime is app.security.session-absolute-timeout.
    timeout: ${APP_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  # Bind to loopback only unless explicitly configured otherwise.
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
  # The Next.js server proxies /api/* and sends X-Forwarded-For. Only loopback counts as a trusted proxy
  # (Tomcat's default would also trust private LAN ranges, letting LAN clients spoof their IP for rate limiting).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1
  servlet:
    session:
      cookie:
        name: CONTOR_SESSION
        http-only: true
        same-site: strict
        secure: ${APP_SECURE_COOKIES:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # No probe group names in the anonymous response.
      probes:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  name: contor
  dev-account:
    # Dev profile only: a login kept ready on every start (created as OWNER, or password/lockout reset). Set in .env.
    username: ${DEV_ACCOUNT_USERNAME:}
    email: ${DEV_ACCOUNT_EMAIL:dev@outlook.com}
    password: ${DEV_ACCOUNT_PASSWORD:}
  web:
    # Public URL of contor-web; the browser is sent back here after the Microsoft OAuth callback.
    url: ${APP_WEB_URL:http://localhost:3000}
  encryption:
    # Base64-encoded 256-bit AES key for *_enc columns. Required: the app refuses to start without a valid key.
    key: ${APP_ENCRYPTION_KEY:}
    key-version: ${APP_ENCRYPTION_KEY_VERSION:1}
  version: '@project.version@'
  ai:
    # Ollama runs natively on the host (GPU) and must stay bound to localhost. Not called in phase 1.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    models:
      routing: ${AI_MODEL_ROUTING:qwen3:4b}
      extraction: ${AI_MODEL_EXTRACTION:qwen3:14b}
      embedding: ${AI_MODEL_EMBEDDING:nomic-embed-text}
  security:
    secure-cookies: ${APP_SECURE_COOKIES:false}
    session-absolute-timeout: ${APP_SESSION_ABSOLUTE_TIMEOUT:12h}
    max-sessions-per-user: 3
    lockout:
      max-failed-attempts: 5
      base-duration: 15m
      max-duration: 24h
    login-rate-limit:
      max-attempts: 10
      window: 1m
  mail:
    msgraph:
      client-id: ${MSGRAPH_CLIENT_ID:}
      client-secret: ${MSGRAPH_CLIENT_SECRET:}
      tenant-id: ${MSGRAPH_TENANT_ID:common}
      redirect-uri: ${MSGRAPH_REDIRECT_URI:http://localhost:8080/api/mail/accounts/callback}
      scopes: ${MSGRAPH_SCOPES:Mail.Read,User.Read,Contacts.Read,offline_access}
    sync:
      interval: ${MAIL_SYNC_INTERVAL:5m}
      enabled: ${MAIL_SYNC_ENABLED:true}
