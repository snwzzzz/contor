spring:
  application:
    name: contor-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/contor}
    username: ${DB_USERNAME:contor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db
  jackson:
    default-property-inclusion: non_null

server:
  # Bind to loopback only unless explicitly configured otherwise.
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  name: contor
  encryption:
    # Base64-encoded 256-bit AES key for *_enc columns. Required: the app refuses to start without a valid key.
    key: ${APP_ENCRYPTION_KEY:}
    key-version: ${APP_ENCRYPTION_KEY_VERSION:1}
  version: '@project.version@'
